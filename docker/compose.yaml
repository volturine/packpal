name: packpal

services:
  app:
    build:
      # Requires: docker compose --project-directory . -f docker/compose.yaml up --build
      context: ..
      dockerfile: docker/Dockerfile
      # adapter-node 6 bakes the origin into the build (no runtime ORIGIN override).
      # Rebuild after changing PACKPAL_PORT or PACKPAL_ORIGIN.
      args:
        PACKPAL_ORIGIN: ${PACKPAL_ORIGIN:-http://localhost:${PACKPAL_PORT:-3000}}
    image: packpal:latest
    restart: unless-stopped
    init: true
    ports:
      - '${PACKPAL_PORT:-3000}:3000'
    environment:
      DATABASE_PATH: /data/packpal.db
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_MODE: ${STRIPE_MODE:-test}
    volumes:
      - packpal-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  packpal-data:
