name: packpal-dev

services:
  app:
    image: '${PACKPAL_IMAGE:?Set PACKPAL_IMAGE in .env.dev}'
    platform: linux/amd64
    pull_policy: always
    restart: unless-stopped
    init: true
    ports:
      - '${PACKPAL_PORT:-3200}:3000'
    environment:
      # The origin is derived from the request: run behind the Tailscale Serve
      # overlay (or another trusted proxy) so the host header is the public origin.
      # adapter-node 6 has no runtime ORIGIN override; direct plain-HTTP exposure
      # needs a PACKPAL_ORIGIN bake instead (see docker/compose.yaml).
      DATABASE_PATH: /data/packpal.db
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_MODE: ${STRIPE_MODE:-test}
    volumes:
      - packpal-dev-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  packpal-dev-data:
