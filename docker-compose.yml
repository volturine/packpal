services:
  packpal:
    build:
      context: .
    ports:
      - '${PORT:-3000}:3000'
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - ORIGIN=${ORIGIN:-http://localhost:3000}
    volumes:
      - packpal-data:/app/data
    restart: unless-stopped

volumes:
  packpal-data:
