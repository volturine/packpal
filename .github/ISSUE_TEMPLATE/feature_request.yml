name: Feature request
description: Suggest an improvement or new capability
title: 'feat: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem you want to solve. Large changes should stay
        compatible with **self-hosting** (single Node process + SQLite) and the
        existing **trip access model** (owner + invited collaborators).
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What pain point or gap does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should PackPal behave if this is implemented?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about (optional).
  - type: dropdown
    id: sharing
    attributes:
      label: Sharing impact
      description: Does this change what collaborators or the server can see?
      options:
        - No change to trip visibility
        - Affects collaborators only (please explain)
        - Unsure — needs design discussion
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for similar requests
          required: true
