name: CI/CD

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Required PR status check: lint + typecheck + unit tests + Node and Cloudflare builds.
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Keep CI, Docker, and local tooling on the same major (see .nvmrc / engines).
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run check

      - name: Unit tests
        run: npm run test:unit

      - name: Test Cloudflare helper scripts
        run: python3 -m unittest scripts/reset_cloudflare_dev_test.py scripts/cloudflare_secrets_test.py

      - name: Production build
        run: npm run build

      - name: Cloudflare Workers build
        run: npm run build:cloudflare

      - name: Validate Cloudflare deployments
        run: |
          npx wrangler deploy --dry-run --env=""
          npx wrangler deploy --dry-run --env dev

  deploy-cloudflare-dev:
    name: Deploy Cloudflare development
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'deploy-dev') &&
      (github.event.action != 'labeled' || github.event.label.name == 'deploy-dev')
    needs: validate
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare-development
      cancel-in-progress: false
    environment:
      name: development
      url: https://dev.packpal.kripso-world.com
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify development deployment ownership
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          owners="$(gh pr list --state open --label deploy-dev --limit 100 --json number --jq 'map(.number) | join(" ")')"
          if [ "$owners" != "$PR_NUMBER" ]; then
            echo "Exactly this PR must be the sole open PR labeled deploy-dev; found: ${owners:-none}" >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy development Worker
        run: |
          python3 -c 'from scripts.cloudflare_secrets import deployment_secrets; import os; deployment_secrets(os.environ)'
          npm run build:cloudflare
          python3 scripts/reset_cloudflare_dev.py
          npx wrangler d1 migrations apply PACKPAL_DB --remote --env dev
          npx wrangler deploy --env dev
          python3 scripts/cloudflare_secrets.py | npx wrangler secret bulk --env dev
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_MODE: test

      - name: Verify development deployment
        run: >-
          curl --fail-with-body --retry 60 --retry-delay 5 --retry-max-time 300
          --retry-all-errors --connect-timeout 10 --max-time 20
          https://dev.packpal.kripso-world.com/health/ready

  deploy-cloudflare-production:
    name: Deploy Cloudflare production
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://packpal.kripso-world.com
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy production Worker
        run: |
          python3 -c 'from scripts.cloudflare_secrets import deployment_secrets; import os; deployment_secrets(os.environ)'
          npm run build:cloudflare
          npx wrangler d1 migrations apply PACKPAL_DB --remote --env=""
          npx wrangler deploy --env=""
          python3 scripts/cloudflare_secrets.py | npx wrangler secret bulk --env=""
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_MODE: live

      - name: Verify production deployment
        run: >-
          curl --fail-with-body --retry 60 --retry-delay 5 --retry-max-time 300
          --retry-all-errors --connect-timeout 10 --max-time 20
          https://packpal.kripso-world.com/health/ready

  image:
    name: Build container image
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Same-repo PRs may push dev-* tags; fork PRs only build (no registry write).
      - name: Log in to GitHub Container Registry
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            # Production floating tag — only on merge/push to master (never PRs).
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' && github.event_name != 'pull_request' }}
            type=raw,value=master,enable=${{ github.ref == 'refs/heads/master' && github.event_name != 'pull_request' }}
            # Immutable production commit tag.
            type=sha,prefix=sha-,format=short,enable=${{ github.event_name != 'pull_request' }}
            # Release tags (v1.2.3 → 1.2.3, 1.2).
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # PR / pre-merge images use a dev- prefix and never share production tags.
            type=ref,event=pr,prefix=dev-
            type=sha,prefix=dev-sha-,format=short,enable=${{ github.event_name == 'pull_request' }}

      - name: Build and publish image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          # Push production tags from master/tags; push dev-* tags from same-repo PRs only.
          push: >-
            ${{
              github.event_name != 'pull_request' ||
              github.event.pull_request.head.repo.full_name == github.repository
            }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
