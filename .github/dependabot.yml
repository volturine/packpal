version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    groups:
      docker:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns:
          - '*'
    ignore:
      # svelte-check and typescript-eslint still require the TypeScript 6 JS compiler API.
      # TypeScript 7.0 dropped that API; 7.1 is expected to restore it.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
